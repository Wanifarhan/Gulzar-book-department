backend:
  name: github
  repo: Wanifarhan/Gulzar-book-department
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: "admin/uploads"
public_folder: "/admin/uploads"

collections:
  - name: "products"
    label: "Products"
    files:
      - file: "products.json"
        label: "Product List"
        name: "products"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            fields:
              - { label: "Photo", name: "image", widget: "image", required: false }
              - { label: "Photo description (for search engines)", name: "image_alt", widget: "string", required: false }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle / details", name: "subtitle", widget: "string", required: false }
              - { label: "Price", name: "price", widget: "string" }

  - name: "settings"
    label: "Site Content"
    files:
      - file: "settings.json"
        label: "Homepage & Contact Info"
        name: "settings"
        fields:
          - { label: "Hero — Main Headline", name: "hero_title", widget: "string" }
          - { label: "Hero — Subtitle", name: "hero_subtitle", widget: "text" }
          - { label: "Hero — Small Tagline (right side)", name: "hero_tagline", widget: "string" }
          - { label: "Hero — Small Text (right side)", name: "hero_side_text", widget: "text" }
          - { label: "About — Kicker (small heading above title)", name: "about_kicker", widget: "string" }
          - { label: "About — Title", name: "about_title", widget: "string" }
          - { label: "About — Paragraph 1", name: "about_para1", widget: "text" }
          - { label: "About — Paragraph 2", name: "about_para2", widget: "text" }
          - { label: "Contact — Address", name: "address", widget: "string" }
          - { label: "Contact — Hours", name: "hours", widget: "string" }
          - { label: "Contact — Phone", name: "phone", widget: "string" }
          - { label: "Contact — Email", name: "email", widget: "string" }
          - { label: "FAQ — Delivery/pickup answer", name: "faq_delivery", widget: "text", required: false }
          - { label: "FAQ — COD/payment answer", name: "faq_cod", widget: "text", required: false }
          - { label: "FAQ — Exchange/return answer", name: "faq_exchange", widget: "text", required: false }
          - label: "Customer Reviews (add real ones here)"
            name: "testimonials"
            widget: "list"
            required: false
            fields:
              - { label: "Review text", name: "quote", widget: "text" }
              - { label: "Customer name", name: "name", widget: "string" }
          - { label: "Google Maps Link (paste share link here)", name: "maps_link", widget: "string", required: false }
          - { label: "Instagram Link", name: "instagram_link", widget: "string", required: false }
          - { label: "Facebook Link", name: "facebook_link", widget: "string", required: false }
          - { label: "Google Reviews Link", name: "reviews_link", widget: "string", required: false }
          - label: "Extra Sections (add new sections here)"
            name: "extra_sections"
            widget: "list"
            required: false
            fields:
              - { label: "Small heading above title", name: "kicker", widget: "string", required: false }
              - { label: "Section Title", name: "title", widget: "string", required: false }
              - { label: "Paragraph text", name: "body", widget: "text", required: false }
